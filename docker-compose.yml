# Uruchomienie: skopiuj .env z apps/api/.env.example i apps/web/.env.example,
# uzupełnij zmienne (Supabase itd.), potem: docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - apps/web/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - API_URL=${API_URL:-http://localhost:3000}
    depends_on:
      - api
    restart: unless-stopped
